[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurozip"
version = "0.1.0"
description = "Research code for small neural lossless byte compression"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Research prototype; see source dataset licenses" }
authors = [{ name = "NeuroZip research project" }]
dependencies = []

[project.optional-dependencies]
train = [
  "torch>=2.2",
]
dev = [
  "pytest>=8",
]

[project.scripts]
neurozip = "neurozip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
